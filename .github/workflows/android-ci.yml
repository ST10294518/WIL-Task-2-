name: Android Build and Tests

on:
  push:
    branches: [Nashlin-Branch, main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-33" "build-tools;34.0.0"

      - name: Prepare Gradle launcher
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run tests and build APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Save debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RhythmFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
